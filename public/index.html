<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Office Handoff</title>
  </head>
  <body>
    <style>
@media print {

  /* hide everything except report */
  body * {
    visibility: hidden;
  }

  #print-report, #print-report * {
    visibility: visible;
  }

  #print-report {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
  }

  /* clean look */
  body {
    font-family: Arial;
    background: white !important;
    color: black;
  }

  button, input, textarea, select {
    display: none !important;
  }

  .print-header {
    border-bottom: 2px solid #000;
    margin-bottom: 20px;
    padding-bottom: 10px;
  }

  .print-section {
    margin-top: 20px;
  }

  .print-item {
    border: 1px solid #ccc;
    padding: 10px;
    margin-bottom: 10px;
    break-inside: avoid;
  }

}
</style>
    <div id="root"></div>
  </body>
</html>
