<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Office Handoff</title>
  </head>
  <body>
    <div id="root"></div>
  </body>
  <style>
@media print {

  /* Hide everything */
  body * {
    visibility: hidden;
  }

  /* Show ONLY report */
  #print-report, #print-report * {
    visibility: visible;
  }

  #print-report {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
  }

  body {
    font-family: Arial, sans-serif;
    background: white !important;
    color: black !important;
  }

  /* Hide buttons + inputs */
  button,
  form,
  input,
  textarea,
  select,
  .no-print {
    display: none !important;
  }

  /* Header styling */
  .print-header {
    border-bottom: 2px solid #000;
    padding-bottom: 12px;
    margin-bottom: 20px;
  }

  .print-header h1 {
    margin: 0 0 10px 0;
  }

  .print-meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 20px;
    font-size: 12px;
  }

  /* Section styling */
  .print-section {
    margin-top: 24px;
  }

  .print-section h2 {
    border-bottom: 1px solid #999;
    padding-bottom: 6px;
  }

  /* Each note */
  .print-item {
    border: 1px solid #bbb !important;
    padding: 10px;
    margin-bottom: 10px;
    background: white !important;
    page-break-inside: avoid;
  }

  @page {
    margin: 0.5in;
  }
}
</style>
</html>
